# Linux appliance / dedicated device profile
lifeline.storage.path=/var/lib/lifeline/data
lifeline.storage.volumes[0].id=memory-card
lifeline.storage.volumes[0].path=/media/lifeline/card
lifeline.storage.volumes[0].writable=true
lifeline.backup.export-dir=/var/lib/lifeline/data/backup

lifeline.tunnel.require-https=true
lifeline.tunnel.mtls-enabled=true
lifeline.tunnel.require-device-identity=true
lifeline.tunnel.allowed-protocols=TLSv1.3
lifeline.mfa.enabled=true

server.port=8443
server.ssl.enabled=true
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3
server.ssl.client-auth=need
server.ssl.key-store=${lifeline.storage.path}/certs/server-keystore.p12
server.ssl.key-store-password=${LIFELINE_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.trust-store=${lifeline.storage.path}/certs/truststore.p12
server.ssl.trust-store-password=${LIFELINE_TRUSTSTORE_PASSWORD:changeit}
server.ssl.trust-store-type=PKCS12
