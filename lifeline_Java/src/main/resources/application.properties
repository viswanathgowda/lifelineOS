spring.application.name=lifelineOS

# --- Local storage ---
# Default: user home. For your 100GB memory card on Windows use profile `card`
#   (D:/lifeline/data). On Linux appliance use profile `device`.
lifeline.storage.path=${user.home}/.lifeline/data
lifeline.storage.encryption.enabled=true
# Base64-encoded 32-byte AES key. Generate: openssl rand -base64 32
lifeline.storage.encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# Extendable volume example (uncomment / set path when card is present):
# lifeline.storage.volumes[0].id=memory-card
# lifeline.storage.volumes[0].path=D:/lifeline/ext
# lifeline.storage.volumes[0].writable=true

# --- Auth (single-owner) ---
lifeline.security.api-token=lifeline-dev-token-change-me
lifeline.security.owner-id=owner

# --- MFA (TOTP) ---
# Set true after configuring authenticator via /api/auth/mfa/setup + /enable
lifeline.mfa.enabled=false
lifeline.mfa.session-ttl-minutes=30
lifeline.mfa.issuer=lifelineOS

# --- Tunnel gateway ---
lifeline.tunnel.require-https=false
lifeline.tunnel.mtls-enabled=false
lifeline.tunnel.require-device-identity=false
lifeline.tunnel.allowed-protocols=TLSv1.3

# --- Backup ---
# Empty = ${lifeline.storage.path}/backup
lifeline.backup.export-dir=

# Embedded H2 (file mode under storage path)
spring.datasource.url=jdbc:h2:file:${lifeline.storage.path}/db/lifeline;DB_CLOSE_DELAY=-1;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=lifeline
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Multipart upload limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

server.port=8080
