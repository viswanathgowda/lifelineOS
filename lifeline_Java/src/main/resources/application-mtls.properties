# Local mTLS development (TLS 1.3 + client cert required)
lifeline.tunnel.require-https=true
lifeline.tunnel.mtls-enabled=true
lifeline.tunnel.require-device-identity=false
lifeline.tunnel.allowed-protocols=TLSv1.3

server.port=8443
server.ssl.enabled=true
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3
server.ssl.client-auth=need
server.ssl.key-store=classpath:certs/server-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.trust-store=classpath:certs/truststore.p12
server.ssl.trust-store-password=changeit
server.ssl.trust-store-type=PKCS12
