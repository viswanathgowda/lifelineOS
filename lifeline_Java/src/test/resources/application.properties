spring.application.name=lifelineOS-test

lifeline.storage.path=${java.io.tmpdir}/lifeline-os-test
lifeline.storage.encryption.enabled=true
lifeline.storage.encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

lifeline.security.api-token=test-token
lifeline.security.owner-id=owner

lifeline.tunnel.require-https=false
lifeline.tunnel.mtls-enabled=false

spring.datasource.url=jdbc:h2:mem:lifeline-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.port=0
